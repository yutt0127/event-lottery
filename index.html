<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動抽獎</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f1e8;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .status {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .winner {
      font-size: 36px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎉 活動抽獎</h1>

    <div class="subtitle">
      即時抽獎活動網站
    </div>

    <div class="card">

      <h2>🎁 活動獎勵</h2>

      <p>🏆 頭獎：500,000 星幣</p>
      <p>🥈 二獎：300,000 星幣</p>
      <p>🥉 三獎：100,000 星幣</p>

    </div>

    <div class="card">

      <div class="status">
        🟢 等待抽獎開始
      </div>

      <div class="winner">
        尚未開獎
      </div>

      <button>
        🎰 開始抽獎
      </button>

    </div>

  </div>

</body>
</html>
